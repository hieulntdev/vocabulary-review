
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ôn Từ Vựng</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Chuyển đổi giao diện">🌙</button>

    <div class="app-container">
        <div class="header">
            <h1>Ôn từ vựng</h1>
            <div class="sub">Import dữ liệu · Flashcard 2 chiều · 3 ngăn · Kiểm tra ngẫu nhiên</div>
        </div>

        <div class="import-area">
            <button class="file-label" id="loadSheetBtn">Load từ Google Sheet</button>
            <div class="status" id="status">Chưa có dữ liệu</div>
        </div>

        <div id="sheetModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-title">Chọn sheet để load dữ liệu</div>
                <div class="sheet-list" id="sheetList"></div>
                <div class="modal-cancel">
                    <button class="modal-cancel-btn" id="cancelSheetBtn">Hủy</button>
                </div>
            </div>
        </div>

        <div id="mainContent">
            <div class="stats-bar">
                <div class="info-badge"><span id="totalCount">0</span> từ</div>
                <div class="filter-group">
                    <input type="text" id="searchInput" class="search-box" placeholder="Tìm từ...">
                </div>
            </div>

            <div class="boxes-row">
                <div class="stat-box red" data-filter="red">
                    <div class="stat-count" id="redCount">0</div>
                    <div class="stat-label">Chưa biết</div>
                </div>
                <div class="stat-box yellow" data-filter="yellow">
                    <div class="stat-count" id="yellowCount">0</div>
                    <div class="stat-label">Phân vân</div>
                </div>
                <div class="stat-box green" data-filter="green">
                    <div class="stat-count" id="greenCount">0</div>
                    <div class="stat-label">Đã biết</div>
                </div>
                <div class="stat-box" data-filter="all">
                    <div class="stat-count" id="allCount">0</div>
                    <div class="stat-label">Tất cả</div>
                </div>
            </div>

            <div class="tab-bar">
                <button class="tab-btn active" data-tab="flashcard">Flashcard & Xếp loại</button>
                <button class="tab-btn" data-tab="quiz">Kiểm tra ngẫu nhiên</button>
            </div>

            <div class="study-layout">
                <div>
                    <div id="flashcardTab">
                        <div class="flashcard-area">
                            <div class="flip-card" id="flipCard">
                                <div class="flip-card-inner">
                                    <div class="front">
                                        <div class="term" id="cardTerm">---</div>
                                        <div class="card-hint">Nhấn để lật</div>
                                    </div>
                                    <div class="back">
                                        <div class="meaning" id="cardMeaning">---</div>
                                        <div class="card-hint">Nhấn để quay lại</div>
                                    </div>
                                </div>
                            </div>
                            <div class="rating-buttons">
                                <button class="rating-btn red" data-rating="red">Chưa biết</button>
                                <button class="rating-btn yellow" data-rating="yellow">Phân vân</button>
                                <button class="rating-btn green" data-rating="green">Đã biết</button>
                            </div>
                            <div class="nav-buttons">
                                <button class="nav-btn" id="prevBtn">Trước</button>
                                <button class="nav-btn" id="nextBtn">Sau</button>
                            </div>
                            <div class="progress-text" id="cardProgress"></div>
                        </div>
                    </div>

                    <div id="quizTab" class="hidden">
                        <div class="quiz-area">
                            <div class="quiz-controls">
                                <label>Số câu: <input type="number" id="quizCount" min="5" max="50" value="10"></label>
                                <label>Chiều:
                                    <select id="quizDirection">
                                        <option value="viet2trung">Việt → Trung</option>
                                        <option value="trung2viet">Trung → Việt</option>
                                        <option value="mixed">Hỗn hợp</option>
                                    </select>
                                </label>
                                <label>Phạm vi:
                                    <select id="quizScope">
                                        <option value="current">Tất cả từ</option>
                                        <option value="weak">Chỉ Chưa biết + Phân vân</option>
                                    </select>
                                </label>
                                <button id="startQuizBtn" class="btn btn-primary">Bắt đầu</button>
                            </div>
                            <div id="quizContainer"></div>
                        </div>
                    </div>
                </div>

                <div class="vocab-list">
                    <div class="vocab-list-title">Danh sách từ</div>
                    <div class="cards-grid" id="vocabGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
